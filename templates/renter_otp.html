<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP - Mundrawati Niketan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            /* बैकग्राउंड इमेज (जो हमने पहले सेट की थी) */
            background: url("{{ url_for('static', filename='images/bg.png') }}") no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.95); /* थोड़ा पारदर्शी सफ़ेद */
            backdrop-filter: blur(10px);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .btn-verify {
            background: #4f46e5;
            color: white;
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
            width: 100%;
            margin-top: 1rem;
            transition: transform 0.2s;
        }
        .btn-verify:hover {
            background: #4338ca;
            transform: translateY(-2px);
        }
        .otp-input {
            letter-spacing: 5px;
            font-size: 1.5rem;
            text-align: center;
            font-weight: bold;
            border-radius: 10px;
            padding: 10px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="mb-4">
            <div class="bg-light rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 60px; height: 60px;">
                <i class="fas fa-shield-alt text-primary fs-3"></i>
            </div>
            <h3 class="fw-bold text-dark">Enter OTP</h3>
    
            <p class="text-muted small">
                We sent a verification code to <br> 
                <strong>{{ contact }}</strong>
            </p>

            {% if visible_otp %}
                <div class="alert alert-warning py-2 small border-warning">
                    <i class="fas fa-exclamation-triangle me-1"></i>
                    API msg send failed. Your OTP is: <strong>{{ visible_otp }}</strong>
                </div>
            {% endif %}
    </div>

    <form method="POST" action="{{ url_for('renter_verify_otp') }}">
        <input type="hidden" name="contact" value="{{ contact }}">
        <input type="hidden" name="actual_otp" value="{{ generated_otp }}">
    
        <div class="mb-3">
            <input type="text" name="user_otp" class="form-control otp-input" placeholder="XXXX" maxlength="4" required autofocus>
        </div>
    
        <button type="submit" class="btn btn-verify">Verify & Login</button>
    </form>

        <div class="mt-4">
            <a href="{{ url_for('main_login') }}" class="text-decoration-none small text-muted">
                <a href="{{ url_for('home') }}" class="btn btn-light border">🔙 Back to Home</a>
            </a>
        </div>
    </div>

</body>
</html>
